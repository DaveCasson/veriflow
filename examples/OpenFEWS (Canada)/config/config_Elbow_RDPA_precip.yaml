# yaml-language-server: $schema=https://deltares.github.io/veriflow/v0/config.schema.json
version: v0
general:
  verification_period:
    dimension: time
    start: "2026-05-15T00:00:00Z"
    end: "2026-06-08T00:00:00Z"
  verification_pairs:
    - variable: PC
      id: PC
      obs: observed
      sim: simulated

datasources:
  - import_adapter: fewswebservice
    source: observed
    data_type: observed_historical
    location_ids:
      - "3031092"
      - "3050778"
      - "MSC-005"
      - "05BL813"
      - "05BJ804"
      - "05BL809"
      - "FIRES-B4"
      - "05BJ805"
      - "05BL812"
      - "FIRES-B5"
      - "05BJ806"
      - "05BH803"
      - "05BF825"
      - "05BH802"
      - "05BL810"
      - "05BF827"
    parameter_ids:
      - PC.obs
    module_instance_id: ImportMeteoStations
    webservice_version: "2025.02"

  - import_adapter: fewswebservice
    source: simulated
    data_type: observed_historical
    location_ids:
      - "3031092"
      - "3050778"
      - "MSC-005"
      - "05BL813"
      - "05BJ804"
      - "05BL809"
      - "FIRES-B4"
      - "05BJ805"
      - "05BL812"
      - "FIRES-B5"
      - "05BJ806"
      - "05BH803"
      - "05BF825"
      - "05BH802"
      - "05BL810"
      - "05BF827"
    parameter_ids:
      - PC.sim
    module_instance_id: PreprocessRDPA
    webservice_version: "2025.02"

scores:
  - score_adapter: continuous_scores
    scores: [mean_error, mae, kge, rmse]
    reduce_dims: []

datasinks:
  - export_adapter: cf_compliant_netcdf
    directory: .
    filename: RDPA_precip_Elbow.nc
    institution: OpenFEWS
    title: RDPA precipitation verification
    force_overwrite: true

id_mapping:
  station:
    "3031092":
      observed: "3031092"
      simulated: "3031092"

  variable:
    PC:
      observed: PC_obs
      simulated: PC_sim
